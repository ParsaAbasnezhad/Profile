{% load static %}

<div class="loader" id="loader">
    <span class="loader-bracket">&lt;</span>
    <span class="loader-dot"></span>
    <span class="loader-bracket">/&gt;</span>
</div>

<div class="scroll-progress" id="scrollProgress"></div>

<aside class="media-bar" aria-label="Social">
    <span class="media-line"></span>
    <a href="#" aria-label="Github" class="media-icon"><img src="{% static 'assets/icons/github.svg' %}"
                                                            alt=""></a>
    <a href="#" aria-label="Dribbble" class="media-icon"><img src="{% static 'assets/icons/dribbble.svg' %}"
                                                              alt=""></a>
    <a href="#" aria-label="Figma" class="media-icon"><img src="{% static 'assets/icons/figma.svg' %}" alt=""></a>
</aside>

<div class="header-bar" id="headerBar">
    <header class="header" id="home">
        <div class="logo">
            <a href="{% url 'portfolio:profile' %}" class="logo-link">
                <img src="{% static 'assets/logo.svg' %}" alt="{{ profile.full_name|default:'Portfolio' }} logo"
                     class="logo-mark">
                <span>{{ profile.full_name|default:"Portfolio" }}</span>
            </a>
        </div>
        <nav class="nav" id="siteNav" aria-label="Primary">
            <a href="{% url 'portfolio:profile' %}#home" class="nav-link"><span class="hash">#</span>home</a>
            <a href="{% url 'portfolio:profile' %}#works" class="nav-link{% if project %} active{% endif %}"><span
                    class="hash">#</span>works</a>
            <a href="{% url 'portfolio:profile' %}#skills" class="nav-link"><span class="hash">#</span>skills</a>
            <a href="{% url 'portfolio:profile' %}#about-me" class="nav-link"><span class="hash">#</span>about-me</a>
            <a href="{% url 'portfolio:visit' %}" class="nav-link"><span class="hash">#</span>visit</a>
            <a href="{% url 'portfolio:profile' %}#message" class="nav-link nav-message"><span
                    class="hash">#</span>send-message</a>
            <div class="lang-switcher" id="langSwitcher">
                <button class="lang-btn" id="langBtn" type="button" aria-expanded="false" aria-haspopup="listbox"
                        aria-controls="langDropdown">
                    <span id="langLabel">EN</span>
                    <svg width="10" height="5" viewBox="0 0 10 5" fill="none" aria-hidden="true">
                        <path d="M1 1L5 4L9 1" stroke="#ABB2BF" stroke-width="1.5"/>
                    </svg>
                </button>
                <div class="lang-dropdown" id="langDropdown" role="listbox">
                    <p data-lang="RU" role="option">RU</p>
                    <p data-lang="UA" role="option">UA</p>
                </div>
            </div>
        </nav>
        <button class="burger" id="burgerBtn" type="button" aria-label="Open menu" aria-expanded="false"
                aria-controls="siteNav">
            <span></span><span></span><span></span>
        </button>
    </header>
</div>
