{% load static %}

<div class="loader" id="loader">
    <span class="loader-bracket">&lt;</span>
    <span class="loader-dot"></span>
    <span class="loader-bracket">/&gt;</span>
</div>

<!-- Scroll progress bar -->
<div class="scroll-progress" id="scrollProgress"></div>

<!-- Social sidebar -->
<aside class="media-bar">
    <span class="media-line"></span>
    <a href="#" aria-label="Github" class="media-icon"><img src="{% static 'assets/icons/github.svg' %}"
                                                            alt="Github"></a>
    <a href="#" aria-label="Dribbble" class="media-icon"><img src="{% static 'assets/icons/dribbble.svg' %}"
                                                              alt="Dribbble"></a>
    <a href="#" aria-label="Figma" class="media-icon"><img src="{% static 'assets/icons/figma.svg' %}" alt="Figma"></a>
</aside>

<div class="page">

    <!-- Header -->
    <header class="header" id="home">
        <div class="logo">
            <img src="{% static 'assets/logo.svg' %}" alt="Elias logo" class="logo-mark">
            <span>Elias</span>
        </div>
        <nav class="nav">
            <a href="#home" class="nav-link"><span class="hash">#</span>home</a>
            <a href="#works" class="nav-link"><span class="hash">#</span>works</a>
            <a href="#skills" class="nav-link"><span class="hash">#</span>skills</a>
            <a href="#about-me" class="nav-link"><span class="hash">#</span>about-me</a>
            <a href="#contacts" class="nav-link"><span class="hash">#</span>contacts</a>
            <a href="#message" class="nav-link nav-message"><span class="hash">#</span>send-message</a>
            <div class="lang-switcher" id="langSwitcher">
                <button class="lang-btn" id="langBtn">
                    <span id="langLabel">EN</span>
                    <svg width="10" height="5" viewBox="0 0 10 5" fill="none">
                        <path d="M1 1L5 4L9 1" stroke="#ABB2BF" stroke-width="1.5"/>
                    </svg>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <p data-lang="RU">RU</p>
                    <p data-lang="UA">UA</p>
                </div>
            </div>
        </nav>
        <button class="burger" id="burgerBtn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </header>
</div>
