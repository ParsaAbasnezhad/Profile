<svg width="460" height="400" viewBox="0 0 460 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blobGrad" x1="0" y1="0" x2="460" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C778DD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C778DD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#31363f"/>
      <stop offset="1" stop-color="#282c33"/>
    </linearGradient>
  </defs>

  <!-- glow blob -->
  <circle class="float-slow" cx="230" cy="190" r="170" fill="url(#blobGrad)"/>

  <!-- laptop -->
  <g class="float-med">
    <rect x="95" y="90" width="270" height="180" rx="10" fill="url(#screenGrad)" stroke="#ABB2BF" stroke-width="1.5"/>
    <rect x="112" y="107" width="236" height="146" rx="4" fill="#20232a"/>

    <!-- code lines -->
    <rect x="128" y="123" width="70" height="8" rx="4" fill="#C778DD"/>
    <rect x="128" y="141" width="120" height="8" rx="4" fill="#ABB2BF"/>
    <rect x="146" y="159" width="90" height="8" rx="4" fill="#ABB2BF" opacity="0.7"/>
    <rect x="146" y="177" width="150" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="128" y="195" width="60" height="8" rx="4" fill="#C778DD"/>
    <rect x="128" y="213" width="180" height="8" rx="4" fill="#ABB2BF" opacity="0.6"/>
    <rect x="146" y="231" width="100" height="8" rx="4" fill="#ffffff" opacity="0.5"/>

    <!-- base -->
    <path d="M75 270H385L365 292H95L75 270Z" fill="#20232a" stroke="#ABB2BF" stroke-width="1.5"/>
  </g>

  <!-- floating brackets -->
  <text x="45" y="230" font-family="Fira Code, monospace" font-size="60" fill="#C778DD" class="float-fast" opacity="0.9">{</text>
  <text x="385" y="150" font-family="Fira Code, monospace" font-size="60" fill="#C778DD" class="float-fast" opacity="0.9">}</text>

  <!-- floating dots grid -->
  <g class="float-med" opacity="0.8">
    <circle cx="390" cy="290" r="3" fill="#ABB2BF"/>
    <circle cx="405" cy="290" r="3" fill="#ABB2BF"/>
    <circle cx="420" cy="290" r="3" fill="#ABB2BF"/>
    <circle cx="390" cy="305" r="3" fill="#ABB2BF"/>
    <circle cx="405" cy="305" r="3" fill="#ABB2BF"/>
    <circle cx="420" cy="305" r="3" fill="#ABB2BF"/>
    <circle cx="390" cy="320" r="3" fill="#ABB2BF"/>
    <circle cx="405" cy="320" r="3" fill="#ABB2BF"/>
    <circle cx="420" cy="320" r="3" fill="#ABB2BF"/>
  </g>

  <!-- small outline square -->
  <rect class="float-slow" x="25" y="55" width="46" height="46" stroke="#ABB2BF" stroke-width="1.5"/>
  <rect class="float-fast" x="30" y="300" width="30" height="30" stroke="#C778DD" stroke-width="1.5"/>
</svg>
